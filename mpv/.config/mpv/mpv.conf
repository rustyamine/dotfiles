profile=gpu-hq
vo=gpu-next
gpu-api=vulkan
hwdec=vaapi-copy
hwdec-codecs=all

# Scaling
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
correct-downscaling=yes
linear-downscaling=yes
scale-antiring=0.7
cscale-antiring=0.7

# Sync
video-sync=display-resample
interpolation=yes
tscale=oversample

# Color
video-output-levels=full
icc-profile-auto=yes
target-colorspace-hint=yes
target-prim=auto
target-trc=srgb
tone-mapping=bt.2390

# Dither
dither-depth=auto
dither=fruit

# Debanding
deband=yes
deband-iterations=2
deband-threshold=35
deband-range=16

# Cache
cache=yes
cache-secs=30




sub-font="Noto Sans"
sub-font-size=42
sub-bold=yes
sub-border-size=2.5
sub-shadow-offset=1
sub-color="#FFFFFF"
sub-border-color="#000000"




# Window
geometry=1280x720
autofit-larger=90%x90%
border=no
keep-open=yes
save-position-on-quit=yes



screenshot-format=png
screenshot-png-compression=1
screenshot-directory=~/Pictures/mpv




osc=no          # Disable default OSC, uosc replaces it
border=no       # Removes window title bar (cleaner look)


no-resume-playback    # don't let it phone home via ytdl hooks
ytdl=no               # disable yt-dlp integration when not needed
