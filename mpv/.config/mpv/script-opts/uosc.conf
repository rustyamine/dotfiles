# Timeline
timeline_size=30
timeline_border=0
timeline_step=5
timeline_cache=yes
timeline_style=bar
timeline_persistency=paused,audio,video
timeline_chapters=dots
timeline_chapters_opacity=0.4

# Controls — centered and clean
controls=menu,gap,subtitles,gap,prev,gap,items,gap,next,gap,space,gap,loop-file,loop-playlist,gap,shuffle,gap,fullscreen
controls_size=30
controls_margin=10
controls_spacing=6
controls_persistency=paused

# Volume — inline not floating
volume=right
volume_size=36
volume_border=0
volume_step=2

# Autohide
autohide=yes
proximity_in=60
proximity_out=130

# Colors — dark, clean, modern
color=foreground=cdd6f4,foreground_text=1e1e2e,background=1e1e2eee,background_text=cdd6f4,curtain=000000aa,success=a6e3a1,error=f38ba8

# Fonts
font_scale=1.1
text_border=1.5

# Menu
menu_item_height=42
menu_min_width=280

# Top bar off — cleaner
top_bar=no
top_bar_controls=no
top_bar_title=no

# Misc
pause_indicator=flash
thumbfast=yes
timeline_persistency=
